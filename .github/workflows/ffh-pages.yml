# ffh2-rs in the browser (projects/ffh2-rs/docs/WEB.md): builds the static site (the client with
# the game engine compiled to WebAssembly), smoke-tests it in headless Chromium and deploys it to
# GitHub Pages (https://misterflask.github.io/misterflask-workshop-1/) on every push to master
# that touches projects/ffh2-rs. One-time setup by the repository owner: Settings -> Pages ->
# Build and deployment -> Source: GitHub Actions.
#
# Run by hand (Actions -> ffh2-rs web -> Run workflow) on any branch to build and test the site;
# only master deploys.

name: ffh2-rs web

on:
  push:
    branches: [master]
    paths:
      - "projects/ffh2-rs/**"
      - ".github/workflows/ffh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      # No cargo cache: the project has no external crates (docs: "No external crates"), and
      # cargo decides whether a workspace crate is fresh by file times, which a fresh checkout
      # always makes newer than a cached target/, so a restored target/ would be rebuilt anyway.

      - name: Build the site
        env:
          # The native ffh-play only exports files here: no debug info (the engine never has any).
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        run: projects/ffh2-rs/tools/web-site.sh _site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The playwright package in a directory of its own (the site has no npm dependencies),
      # and the Chromium build that version drives.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Smoke test (service worker isolation)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node projects/ffh2-rs/tools/web-site-smoke.mjs --site _site --out "$RUNNER_TEMP/smoke/sw"

      - name: Smoke test (no isolation, the fallback)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node projects/ffh2-rs/tools/web-site-smoke.mjs --site _site --no-sw --turns 2 --out "$RUNNER_TEMP/smoke/no-sw"

      - name: Keep the smoke tests' screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-site-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

      # Fails with a clear message until Pages is enabled with the source "GitHub Actions".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
