[workspace]
resolver = "2"
members = ["crates/ffh-data", "crates/ffh-core", "crates/ffh-ai", "crates/ffh-cli", "crates/ffh-stress", "crates/ffh-play"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
debug = 1
codegen-units = 16

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
