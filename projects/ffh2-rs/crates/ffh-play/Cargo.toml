[package]
name = "ffh-play"
description = "Human play: session core, browser (HTTP) and JSONL agent front-ends (docs/PLAY_DESIGN.md)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ffh_play"
path = "src/lib.rs"

[[bin]]
name = "ffh-play"
path = "src/main.rs"

[dependencies]
ffh-data = { path = "../ffh-data" }
ffh-core = { path = "../ffh-core" }
ffh-ai = { path = "../ffh-ai" }
