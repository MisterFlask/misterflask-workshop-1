[package]
name = "ffh-web"
description = "The engine for the static site: ffh-play's web host compiled to WebAssembly (wasm32-wasip1), run in a Web Worker (docs/WEB.md)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ffh_web"
path = "src/lib.rs"
# The module the page loads (`cargo build --release --target wasm32-wasip1 -p ffh-web`). Natively
# the crate is empty (everything is `cfg(target_arch = "wasm32")`).
crate-type = ["cdylib"]
doctest = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
ffh-data = { path = "../ffh-data" }
ffh-play = { path = "../ffh-play" }
